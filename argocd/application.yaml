apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudops-nexus
  namespace: argocd
  labels:
    app.kubernetes.io/name: cloudops-nexus
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloudops-project
  source:
    repoURL: "https://github.com/psgaikwad2003/Project-1.git"
    targetRevision: main
    path: helm/cloudops-nexus
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
