apiVersion: v1
kind: Namespace
metadata:
  name: cloudops
  labels:
    name: cloudops
    environment: production
    app.kubernetes.io/part-of: cloudops-nexus
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cloudops-quota
  namespace: cloudops
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cloudops-limits
  namespace: cloudops
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
