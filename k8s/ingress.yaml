apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudops-nexus-ingress
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-nexus
    app.kubernetes.io/part-of: cloudops-nexus
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.cloudops-nexus.example.com
      secretName: cloudops-nexus-tls-cert
  rules:
    - host: api.cloudops-nexus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudops-nexus-svc
                port:
                  number: 80
