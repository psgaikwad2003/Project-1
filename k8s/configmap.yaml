apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-nexus-config
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-nexus
    app.kubernetes.io/part-of: cloudops-nexus
data:
  APP_NAME: "cloudops-nexus"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  PORT: "8000"
  HOST: "0.0.0.0"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
